<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gelo Tutóia — Conexão de teste</title><style>
body{font:16px system-ui;background:#f7f5ef;color:#292c27;margin:0;padding:24px}main{max-width:480px;margin:30px auto;background:#fff;padding:24px;border-radius:24px}
button,input{box-sizing:border-box;width:100%;font:inherit;padding:14px;border-radius:12px;margin-top:12px}
button{background:#f2c35f;border:0;font-weight:700}input{border:1px solid #dadbd3}#status{white-space:pre-wrap;line-height:1.6}small{color:#646860}
</style></head><body><main><h1>Gelo Tutóia</h1><p>Teste privado do banco Supabase. Não altera o aplicativo atual.</p>
<label for="email">Seu e-mail de acesso</label><input id="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com">
<button id="send">Enviar código de acesso</button>
<div id="codeWrap" hidden><label for="code">Código recebido por e-mail</label><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Código"><button id="verify">Confirmar código</button></div>
<button id="check" hidden>Verificar conexão</button><button id="logout" hidden>Sair</button><p id="status"></p>
<small>Acesso permitido somente à conta aprovada pelo proprietário. Chave administrativa nunca é enviada ao navegador.</small>
</main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://eebkuiivyolszarnpjkx.supabase.co','sb_publishable_P_gbUJOnu80Ix38PtwnGgg_MNp1bmZS');
const $=x=>document.getElementById(x),say=x=>$('status').textContent=x;
async function refresh(){const {data:{session}}=await db.auth.getSession();$('check').hidden=!session;$('logout').hidden=!session;return !!session}
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return say('Informe seu e-mail.');say('Enviando...');const {error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)return say(error.message);$('codeWrap').hidden=false;say('Confira seu e-mail e informe o código. Se receber um link, abra-o no mesmo navegador.')};
$('verify').onclick=async()=>{const {error}=await db.auth.verifyOtp({email:$('email').value.trim(),token:$('code').value.trim(),type:'email'});if(error)return say(error.message);say('Acesso autenticado.');await refresh()};
$('check').onclick=async()=>{say('Verificando permissão...');const {data:allowed,error:e1}=await db.from('gelo_owners').select('user_id').limit(1);if(e1)return say('Erro de acesso: '+e1.message);if(!allowed?.length)return say('Login confirmado. Aguardando autorização da conta para consultar as vendas.');const [a,b]=await Promise.all([db.from('gelo_control_sales').select('id',{count:'exact',head:true}),db.from('gelo_control_expenses').select('id',{count:'exact',head:true})]);say('Conectado ao banco de testes. Vendas: '+(a.count??'erro')+'; despesas: '+(b.count??'erro'))};
$('logout').onclick=async()=>{await db.auth.signOut();say('Sessão encerrada.');await refresh()};refresh();
</script></body></html>
